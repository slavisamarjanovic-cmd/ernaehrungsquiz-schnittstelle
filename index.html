<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f5257">
  <title>Ernährung im Alter – Quiz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230f5257'/%3E%3Cpath d='M20 34c0-7 5-12 12-12s12 5 12 12' stroke='%23f4b183' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 38h32' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <div class="brand" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="32" height="32" focusable="false"><circle cx="32" cy="32" r="30" fill="#0f5257"/><path d="M20 34c0-7 5-12 12-12s12 5 12 12" stroke="#f4b183" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M16 38h32" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
        <span>Ernährung im Alter</span>
      </div>
      <div class="progress" id="progress" hidden>
        <p class="progress__label" id="progress-label"></p>
        <div class="progress__track" role="progressbar" id="progress-bar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="16" aria-valuenow="0">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
        <ol class="stepper" id="stepper" aria-label="Abschnitte"></ol>
      </div>
    </div>
  </header>

  <div class="banner banner--test" id="test-banner" hidden>
    Testmodus: Abgaben werden in der Tabelle als <strong>Testdaten</strong> markiert und nicht ausgewertet.
  </div>
  <div class="banner banner--practice" id="practice-banner" hidden>
    Übungsdurchlauf: Deine Antworten werden <strong>nicht gespeichert</strong>.
  </div>

  <main id="main" tabindex="-1">
    <noscript>
      <div class="card"><p>Bitte aktiviere JavaScript, um das Quiz zu nutzen.</p></div>
    </noscript>
  </main>

  <p class="sr-only" id="live" aria-live="polite"></p>

  <footer class="footer">
    <a href="datenschutz.html">Datenschutzhinweis</a>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-title">
    <div class="lightbox__head">
      <h2 id="lightbox-title" class="lightbox__title"></h2>
      <button type="button" class="btn btn--ghost" id="lightbox-close">Schliessen</button>
    </div>
    <img id="lightbox-img" alt="">
  </dialog>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/quiz-content.js"></script>
  <script src="assets/js/logic.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
